[package]
name = "aethermaul_td"
version = "0.1.0"
edition = "2024"
description = "3D Fantasy Mazing Tower Defense inspired by Warcraft 3 Custom Maps"

[features]
default = []
# Schnelles inkrementelles Linken während der Entwicklung:
# cargo run --features dev_fast
dev_fast = ["bevy/dynamic_linking"]
# Optionaler Live-ECS-Inspector (nur für Dev/Balancing):
# cargo run --features "dev_fast dev_tools"
dev_tools = ["dep:bevy_egui", "dep:bevy-inspector-egui"]
# Optional auf Linux mit installiertem libasound2-dev:
linux_audio = ["bevy/bevy_audio", "bevy/wav", "bevy/vorbis"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "3d_bevy_render",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "scene",
    "picking",
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
    "custom_cursor",
    "sysinfo_plugin",
    "keyboard",
    "mouse",
] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
rand = "0.10"
pathfinding = "4.16"
smallvec = "1.16"
thiserror = "2.0"
directories = "6.0"

# Optionale Dev-Tools
bevy_egui = { version = "0.43", optional = true }
bevy-inspector-egui = { version = "0.38", optional = true }

# Auf Windows & macOS ist natives Audio (WASAPI / CoreAudio) immer aktiv
[target.'cfg(not(target_os = "linux"))'.dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_audio",
    "wav",
    "vorbis",
] }

# ---------------------------------------------------------------------------
# Fast-Compile Dev-Profil
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

# ---------------------------------------------------------------------------
# Performance-orientiertes Release-Profil für die Windows-.exe
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
